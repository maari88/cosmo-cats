spring:
  application:
    name: marketplace
  datasource:
    url: jdbc:h2:mem:cosmocatsdb
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

pricing:
  api:
    base-url: http://localhost:8080

feature:
  cosmoCats:
    enabled: true
  kittyProducts:
    enabled: false